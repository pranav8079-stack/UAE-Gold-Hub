name: Build GoldPulse UAE APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project files
        run: flutter create --platforms android --org com.pranav .
      - name: Create app icons
        run: |
          mkdir -p assets/icon
          echo "$ICON_B64" | base64 -d > assets/icon/app_icon.png
          echo "$ICONFG_B64" | base64 -d > assets/icon/app_icon_fg.png
        env:
          ICON_B64: ""
          ICONFG_B64: ""
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoldPulse-UAE-APK
          path: build/app/outputs/flutter-apk/app-release.apk
